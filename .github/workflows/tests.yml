name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    name: Fast tests (no Docker, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the fast tier
        run: make test
